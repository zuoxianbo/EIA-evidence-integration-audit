name: eia-repro

channels:
  - conda-forge

dependencies:
  # ---- R (figure generation) ----
  - r-base=4.6.1
  - r-ggplot2=4.0.3
  - r-ragg=1.5.2
  - r-patchwork=1.3.2
  - r-cowplot=1.1.3
  - r-scales=1.3.0
  - r-ggrepel=0.9.8
  - r-dplyr=1.1.4
  - r-tidyr=1.3.1
  - r-readr=2.1.5

  # ---- Python (frozen analysis pipeline) ----
  - python=3.11
  - pip
  - pip:
      # Numerical / statistical core — REQUIRED by code/python/run_analysis.py
      # for the 19 scorers, the paired bootstrap and the BH procedure.
      - numpy>=1.26,<3
      - scikit-learn>=1.4,<2
      - scipy>=1.11,<2
      # Document assembly utilities (build.py, build_submission_forms.py,
      # wordcount.py).
      - python-docx==1.2.0
